    <script>
      /* Storage guard precisa rodar antes do bundle. Em alguns navegadores o
         preview em iframe bloqueia localStorage/sessionStorage; o cliente de
         autenticação lê localStorage durante o import inicial, o que derrubava
         o bootstrap antes do React montar. */
      (function () {
        function createMemoryStorage() {
          var store = {};
          return {
            get length() { return Object.keys(store).length; },
            clear: function () { store = {}; },
            getItem: function (key) { return Object.prototype.hasOwnProperty.call(store, key) ? store[key] : null; },
            key: function (index) { return Object.keys(store)[index] || null; },
            removeItem: function (key) { delete store[key]; },
            setItem: function (key, value) { store[key] = String(value); }
          };
        }

        function ensureStorage(name) {
          try {
            var storage = window[name];
            var testKey = '__mci_storage_boot_' + Date.now();
            storage.setItem(testKey, '1');
            storage.removeItem(testKey);
          } catch (_) {
            try {
              Object.defineProperty(window, name, {
                configurable: true,
                value: createMemoryStorage()
              });
              console.warn('[Startup] ' + name + ' bloqueado; usando fallback em memória.');
            } catch (_) {}
          }
        }

        ensureStorage('localStorage');
        ensureStorage('sessionStorage');
      })();

      /* Defensive DOM patch: swallow the React/Google-Translate "removeChild on Node" race.
         See facebook/react#11538. We ONLY intercept the exact NotFoundError where the parent
         no longer contains the child; every other call falls through unchanged. */
      (function () {
        if (typeof Node === 'undefined' || Node.prototype.__mciDomPatched) return;
        Node.prototype.__mciDomPatched = true;
        var _removeChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child && child.parentNode !== this) {
            if (typeof console !== 'undefined' && console.warn) {
              console.warn('[DOM] removeChild ignorado: nó não é filho deste pai (provável extensão/tradutor).');
            }
            return child;
          }
          return _removeChild.apply(this, arguments);
        };
        var _insertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (typeof console !== 'undefined' && console.warn) {
              console.warn('[DOM] insertBefore: referenceNode não é filho deste pai, usando appendChild.');
            }
            return this.appendChild(newNode);
          }
          return _insertBefore.apply(this, arguments);
        };
      })();

    </script>
